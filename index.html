<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PBX 通话看板</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page-plane:     #f9f9f7;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --gridline:       #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.10);
    --success-text:   #006300;
    --series-1: #2a78d6; /* 呼出接通 */
    --series-3: #1baf7a; /* 呼入接听 */
    --series-8: #e34948; /* 未接来电 */
    --seq-100: #cde2fb; --seq-250: #86b6ef; --seq-400: #3987e5; --seq-450: #2a78d6; --seq-600: #184f95;
    --status-critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1:      #1a1a19;
      --page-plane:     #0d0d0d;
      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #898781;
      --gridline:       #2c2c2a;
      --baseline:       #383835;
      --border:         rgba(255,255,255,0.10);
      --success-text:   #0ca30c;
      --series-1: #3987e5;
      --series-3: #199e70;
      --series-8: #e66767;
      --seq-100: #184f95; --seq-250: #1c5cab; --seq-400: #3987e5; --seq-450: #5598e7; --seq-600: #b7d3f6;
      --status-critical: #e66767;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--page-plane);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body { padding: 20px 16px 48px; }
  .wrap { max-width: 1180px; margin: 0 auto; }
  header.page-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 18px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--text-secondary); font-size: 13px; }
  .meta { color: var(--text-muted); font-size: 12px; text-align: right; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 18px; }
  .range-group { display: inline-flex; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
  .range-btn { border: none; background: transparent; color: var(--text-secondary); font-size: 13px; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  .range-btn.active { background: var(--series-1); color: #fff; }
  .search-box { margin-left: auto; }
  .search-box input {
    font-size: 13px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); min-width: 200px;
  }
  .custom-range { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); }
  .custom-range input[type="date"] {
    font-family: inherit; font-size: 13px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface-1); color: var(--text-primary); font-variant-numeric: tabular-nums;
  }
  .custom-range .apply-btn { background: var(--series-1); color: #fff; }

  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .kpi-tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .kpi-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
  .kpi-value { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

  .panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 18px 18px 12px; margin-bottom: 20px; }
  .panel h2 { font-size: 15px; margin: 0 0 12px; }
  .rank-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .rank-sub-title { font-size: 13px; color: var(--text-secondary); margin: 0 0 8px; font-weight: 500; }
  @media (max-width: 700px) { .rank-grid { grid-template-columns: 1fr; } }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; font-size: 12px; color: var(--text-secondary); }
  .legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  svg text { fill: var(--text-secondary); font-size: 11px; }
  .axis-line { stroke: var(--baseline); stroke-width: 1; }
  .grid-line { stroke: var(--gridline); stroke-width: 1; }
  .bar-hit { fill: transparent; cursor: pointer; }
  .bar-hit:hover + rect.bar, rect.bar:hover { filter: brightness(1.08); }

  #tooltip {
    position: fixed; pointer-events: none; z-index: 50;
    background: var(--text-primary); color: var(--page-plane);
    font-size: 12px; padding: 6px 10px; border-radius: 6px; opacity: 0; transition: opacity .1s;
    max-width: 220px;
  }

  table.detail { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.detail th, table.detail td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--gridline); font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.detail th:first-child, table.detail td:first-child { text-align: left; font-variant-numeric: normal; }
  table.detail th { color: var(--text-secondary); font-weight: 500; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface-1); }
  table.detail th.sorted::after { content: " \25BE"; }
  table.detail tbody tr:hover { background: color-mix(in srgb, var(--series-1) 6%, transparent); }
  .table-scroll { overflow-x: auto; }
  .miss-cell { color: var(--status-critical); font-weight: 600; }
  .empty-note { color: var(--text-muted); font-size: 13px; padding: 20px 0; text-align: center; }

  footer.foot { color: var(--text-muted); font-size: 11px; text-align: center; margin-top: 24px; }

  .clickable-row { cursor: pointer; }
  .clickable-row:hover td:first-child { text-decoration: underline; }
  .rank-label { cursor: pointer; }
  .rank-label:hover { text-decoration: underline; }

  .detail-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .detail-overlay[hidden] { display: none; }
  .detail-modal {
    background: var(--surface-1); border-radius: 12px; max-width: 720px; width: 100%;
    max-height: 80vh; display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid var(--border);
  }
  .detail-modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--gridline);
  }
  .detail-modal-head h3 { margin: 0; font-size: 15px; }
  .detail-modal .table-scroll { overflow-y: auto; padding: 0 18px 18px; }
  .close-btn {
    border: none; background: transparent; color: var(--text-secondary);
    font-size: 20px; line-height: 1; cursor: pointer; padding: 2px 6px;
  }
  .close-btn:hover { color: var(--text-primary); }
</style>
</head>
<body>
<div class="wrap">
  <header class="page-head">
    <div>
      <h1>PBX 通话看板</h1>
      <div class="subtitle">Hilong Seafood International Inc · 数据来源: Seawolf Hosted PBX 通话记录</div>
    </div>
    <div class="meta">数据更新至 2026-10-26 08:00</div>
  </header>

  <div class="toolbar">
    <div class="range-group" id="rangeGroup">
      <button class="range-btn" data-range="1">今天</button>
      <button class="range-btn" data-range="7">近7天</button>
      <button class="range-btn active" data-range="30">近30天</button>
      <button class="range-btn" data-range="all">全部</button>
      <button class="range-btn" data-range="custom">自定义</button>
    </div>
    <div class="custom-range" id="customRangePanel" hidden>
      <input type="date" id="customStart"> ~ <input type="date" id="customEnd">
      <button class="range-btn apply-btn" id="applyCustomRange">应用</button>
    </div>
    <div class="search-box"><input id="searchInput" type="text" placeholder="按分机号 / 姓名筛选..."></div>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="panel">
    <h2>每日通话量趋势</h2>
    <div class="legend">
      <span class="legend-item"><span class="swatch" style="background:var(--series-1)"></span>呼出接通</span>
      <span class="legend-item"><span class="swatch" style="background:var(--series-3)"></span>呼入接听</span>
      <span class="legend-item"><span class="swatch" style="background:var(--series-8)"></span>未接来电</span>
    </div>
    <div id="dailyChart"></div>
  </div>

  <div class="panel">
    <h2>坐席排行</h2>
    <div class="rank-grid">
      <div>
        <h3 class="rank-sub-title">呼出接通</h3>
        <div id="rankChartOut"></div>
      </div>
      <div>
        <h3 class="rank-sub-title">呼入接听</h3>
        <div id="rankChartIn"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <h2>坐席明细</h2>
    <div class="table-scroll">
      <table class="detail" id="detailTable">
        <thead>
          <tr>
            <th data-key="label">分机 / 姓名</th>
            <th data-key="out">呼出总数</th>
            <th data-key="out_ans">呼出接通</th>
            <th data-key="in">呼入总数</th>
            <th data-key="in_ans" class="sorted">呼入接听</th>
            <th data-key="missed">未接来电</th>
            <th data-key="ans_rate">呼入接听率</th>
            <th data-key="total_dur">总通话时长</th>
            <th data-key="avg_dur">平均通话时长</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <footer class="foot">由本地脚本从 PBX 网页抓取生成,仅供内部查看 · 生成时间 2026-10-26 08:00</footer>
</div>
<div id="tooltip"></div>

<div id="detailOverlay" class="detail-overlay" hidden>
  <div class="detail-modal">
    <div class="detail-modal-head">
      <h3 id="detailModalTitle"></h3>
      <button id="detailModalClose" class="close-btn" aria-label="关闭">&times;</button>
    </div>
    <div class="table-scroll">
      <table class="detail" id="callDetailTable">
        <thead>
          <tr>
            <th>时间</th>
            <th>方向</th>
            <th>对方号码</th>
            <th>地区</th>
            <th>接通</th>
            <th>时长</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>

function shortExt(ext) {
  return ext.replace(/^[A-Za-z]+/, '');
}
function labelFor(ext) {
  const name = EXT_NAMES[ext];
  return name ? `${name} (${shortExt(ext)})` : shortExt(ext);
}
function fmtDur(sec) {
  sec = Math.round(sec || 0);
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}分${String(s).padStart(2,'0')}秒`;
}
function fmtPct(n) { return isFinite(n) ? `${Math.round(n*100)}%` : '-'; }

let currentRange = 30;
let customRange = null; // {start, end} when the "自定义" range is active
let searchTerm = '';

function allDates() {
  return [...new Set(DAILY.map(r => r.date))].sort();
}
function activeDateBounds() {
  const dates = allDates();
  if (dates.length === 0) return null;
  if (customRange) return { start: customRange.start, end: customRange.end };
  if (currentRange === 'all') return { start: dates[0], end: dates[dates.length - 1] };
  const cutoffIdx = Math.max(0, dates.length - currentRange);
  return { start: dates[cutoffIdx], end: dates[dates.length - 1] };
}
function filteredByRange() {
  const bounds = activeDateBounds();
  if (!bounds) return DAILY;
  return DAILY.filter(r => r.date >= bounds.start && r.date <= bounds.end);
}

function aggregateByDay(rows) {
  const map = new Map();
  for (const r of rows) {
    if (!map.has(r.date)) map.set(r.date, {date: r.date, out_ans:0, in_ans:0, missed:0});
    const d = map.get(r.date);
    d.out_ans += r.out_ans;
    d.in_ans += r.in_ans;
    d.missed += (r.in - r.in_ans);
  }
  return [...map.values()].sort((a,b) => a.date < b.date ? -1 : 1);
}

function aggregateByExt(rows) {
  const map = new Map();
  for (const r of rows) {
    if (!map.has(r.ext)) map.set(r.ext, {ext: r.ext, out:0, out_ans:0, in:0, in_ans:0, out_dur:0, in_dur:0});
    const a = map.get(r.ext);
    a.out += r.out; a.out_ans += r.out_ans; a.in += r.in; a.in_ans += r.in_ans;
    a.out_dur += r.out_dur; a.in_dur += r.in_dur;
  }
  return [...map.values()].map(a => {
    const missed = a.in - a.in_ans;
    const total_dur = a.out_dur + a.in_dur;
    const answered_calls = a.out_ans + a.in_ans;
    return {
      ...a,
      label: labelFor(a.ext),
      missed,
      ans_rate: a.in > 0 ? a.in_ans / a.in : 0,
      total_dur,
      avg_dur: answered_calls > 0 ? total_dur / answered_calls : 0,
      total_answered: answered_calls,
    };
  });
}

function renderKPIs(dayRows, extRows) {
  const sum = (arr, k) => arr.reduce((s,x) => s + x[k], 0);
  const outAns = sum(extRows, 'out_ans');
  const outTotal = sum(extRows, 'out');
  const inAns = sum(extRows, 'in_ans');
  const inTotal = sum(extRows, 'in');
  const missed = inTotal - inAns;
  const totalDur = sum(extRows, 'out_dur') + sum(extRows, 'in_dur');
  const answeredCalls = outAns + inAns;
  const avgDur = answeredCalls > 0 ? totalDur / answeredCalls : 0;
  const tiles = [
    ['呼出电话', outTotal, `接通 ${outAns}`],
    ['呼入电话', inTotal, `接听 ${inAns}`],
    ['未接来电', missed, inTotal > 0 ? `占呼入 ${fmtPct(missed/inTotal)}` : ''],
    ['呼入接听率', fmtPct(inTotal>0?inAns/inTotal:0), ''],
    ['接通电话总数', answeredCalls, '呼出接通+呼入接听'],
    ['平均通话时长', fmtDur(avgDur), '按已接通电话计算'],
  ];
  const el = document.getElementById('kpiRow');
  el.innerHTML = tiles.map(([label, value, sub]) => `
    <div class="kpi-tile">
      <div class="kpi-label">${label}</div>
      <div class="kpi-value">${value}</div>
      <div class="kpi-sub">${sub}</div>
    </div>`).join('');
}

}
function hideTooltip() { document.getElementById('tooltip').style.opacity = 0; }

function renderDailyChart(dayRows) {
  const container = document.getElementById('dailyChart');
  if (dayRows.length === 0) { container.innerHTML = '<div class="empty-note">该时间段暂无数据</div>'; return; }
  const W = Math.max(600, dayRows.length * 46 + 60);
  const H = 220;
  const padL = 36, padB = 28, padT = 10, padR = 10;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const maxVal = Math.max(1, ...dayRows.map(d => Math.max(d.out_ans, d.in_ans, d.missed)));
  const groupW = plotW / dayRows.length;
  const barW = Math.min(12, groupW / 5);
  const series = [
    {key:'out_ans', color:'var(--series-1)', name:'呼出接通'},
    {key:'in_ans', color:'var(--series-3)', name:'呼入接听'},
    {key:'missed', color:'var(--series-8)', name:'未接来电'},
  ];
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">`;
  // gridlines
  const ticks = 4;
  for (let i=0;i<=ticks;i++) {
    const y = padT + plotH - (plotH*i/ticks);
    const val = Math.round(maxVal*i/ticks);
    svg += `<line class="grid-line" x1="${padL}" x2="${W-padR}" y1="${y}" y2="${y}"/>`;
    svg += `<text x="${padL-6}" y="${y+3}" text-anchor="end">${val}</text>`;
  }
  svg += `<line class="axis-line" x1="${padL}" x2="${W-padR}" y1="${padT+plotH}" y2="${padT+plotH}"/>`;

  dayRows.forEach((d, gi) => {
    const gx = padL + gi*groupW + groupW/2 - (series.length*barW)/2;
    series.forEach((s, si) => {
      const val = d[s.key];
      const h = (val/maxVal) * plotH;
      const x = gx + si*barW;
      const y = padT + plotH - h;
      svg += `<rect class="bar-hit" x="${x-2}" y="${padT}" width="${barW+4}" height="${plotH}" data-idx="${gi}" data-si="${si}"/>`;
      svg += `<rect class="bar" x="${x}" y="${y}" width="${barW-2}" height="${h}" rx="2" fill="${s.color}" data-idx="${gi}" data-si="${si}"/>`;
    });
    if (dayRows.length <= 20 || gi % Math.ceil(dayRows.length/20) === 0) {
      svg += `<text x="${padL+gi*groupW+groupW/2}" y="${H-8}" text-anchor="middle">${d.date.slice(5)}</text>`;
    }
  });
  svg += `</svg>`;
  container.innerHTML = svg;

  container.querySelectorAll('rect[data-idx]').forEach(rect => {
    rect.addEventListener('mousemove', (evt) => {
      const d = dayRows[+rect.dataset.idx];
      showTooltip(evt, `<b>${d.date}</b><br>呼出接通: ${d.out_ans}<br>呼入接听: ${d.in_ans}<br>未接来电: ${d.missed}`);
    });
    rect.addEventListener('mouseleave', hideTooltip);
  });
}

function renderRankChartInto(containerId, extRows, metricKey) {
  const container = document.getElementById(containerId);
  const rows = [...extRows].sort((a,b) => b[metricKey] - a[metricKey]).slice(0, 10).filter(r => r[metricKey] > 0);
  if (rows.length === 0) { container.innerHTML = '<div class="empty-note">该时间段暂无数据</div>'; return; }
  const W = 320, rowH = 28, padT = 8, padB = 8, padL = 110, padR = 36;
  const H = rowH*rows.length + padT + padB;
  const maxVal = Math.max(1, ...rows.map(r => r[metricKey]));
  const plotW = W - padL - padR;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">`;
  rows.forEach((r, i) => {
    const y = padT + i*rowH;
    const val = r[metricKey];
    const w = (val/maxVal) * plotW;
    svg += `<text class="rank-label" data-idx="${i}" x="${padL-8}" y="${y+rowH/2+4}" text-anchor="end">${r.label}</text>`;
    svg += `<rect class="bar-hit" x="${padL}" y="${y+2}" width="${plotW}" height="${rowH-6}" data-idx="${i}"/>`;
    svg += `<rect class="bar" x="${padL}" y="${y+4}" width="${Math.max(2,w)}" height="${rowH-10}" rx="4" fill="var(--seq-400)" data-idx="${i}"/>`;
    svg += `<text x="${padL+w+8}" y="${y+rowH/2+4}">${val}</text>`;
  });
  svg += `</svg>`;
  container.innerHTML = svg;
  container.querySelectorAll('rect[data-idx]').forEach(rect => {
    rect.addEventListener('mousemove', (evt) => {
      const r = rows[+rect.dataset.idx];
      showTooltip(evt, `<b>${r.label}</b><br>呼出接通: ${r.out_ans}<br>呼入接听: ${r.in_ans}<br>平均时长: ${fmtDur(r.avg_dur)}`);
    });
    rect.addEventListener('mouseleave', hideTooltip);
    rect.addEventListener('click', () => openCallDetail(rows[+rect.dataset.idx].ext));
  });
  container.querySelectorAll('.rank-label').forEach(el => {
    el.addEventListener('click', () => openCallDetail(rows[+el.dataset.idx].ext));
  });
}

function renderRankChart(extRows) {
  renderRankChartInto('rankChartOut', extRows, 'out_ans');
  renderRankChartInto('rankChartIn', extRows, 'in_ans');
}

let sortKey = 'in_ans', sortDir = -1;
function renderTable(extRows) {
  const tbody = document.querySelector('#detailTable tbody');
  let rows = extRows.filter(r => !searchTerm || r.label.toLowerCase().includes(searchTerm) || r.ext.toLowerCase().includes(searchTerm));
  rows.sort((a,b) => {
    const av = a[sortKey], bv = b[sortKey];
    return av < bv ? -1*sortDir : av > bv ? 1*sortDir : 0;
  });
  if (rows.length === 0) { tbody.innerHTML = `<tr><td colspan="9" class="empty-note">没有匹配的坐席</td></tr>`; return; }
  tbody.innerHTML = rows.map(r => `
    <tr class="clickable-row" data-ext="${r.ext}" title="点击查看通话明细">
      <td>${r.label}</td>
      <td>${r.out}</td>
      <td>${r.out_ans}</td>
      <td>${r.in}</td>
      <td>${r.in_ans}</td>
      <td class="${r.missed>0?'miss-cell':''}">${r.missed}</td>
      <td>${fmtPct(r.ans_rate)}</td>
      <td>${fmtDur(r.total_dur)}</td>
      <td>${fmtDur(r.avg_dur)}</td>
    </tr>`).join('');
  tbody.querySelectorAll('tr[data-ext]').forEach(tr => {
    tr.addEventListener('click', () => openCallDetail(tr.dataset.ext));
  });
}

function openCallDetail(ext) {
  const bounds = activeDateBounds();
  const rows = CALLS.filter(c => c.ext === ext && (!bounds || (c.date >= bounds.start && c.date <= bounds.end)));
  document.getElementById('detailModalTitle').textContent =
    `${labelFor(ext)} 的通话明细 (${rows.length} 条)`;
  const tbody = document.querySelector('#callDetailTable tbody');
  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty-note">该时间段没有通话记录</td></tr>`;
  } else {
    tbody.innerHTML = rows.map(c => `
      <tr>
        <td>${c.date} ${c.time}</td>
        <td>${c.direction === 'outbound' ? '呼出' : '呼入'}</td>
        <td>${c.number}</td>
        <td>${c.location || '-'}</td>
        <td>${c.answered ? '是' : '否'}</td>
        <td>${c.answered ? fmtDur(c.duration) : '-'}</td>
      </tr>`).join('');
  }
  document.getElementById('detailOverlay').hidden = false;
}

document.getElementById('detailModalClose').addEventListener('click', () => {
  document.getElementById('detailOverlay').hidden = true;
});
document.getElementById('detailOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'detailOverlay') e.currentTarget.hidden = true;
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.getElementById('detailOverlay').hidden = true;
});

function rerender() {
  const rows = filteredByRange();
  const dayRows = aggregateByDay(rows);
  const extRows = aggregateByExt(rows);
  renderKPIs(dayRows, extRows);
  renderDailyChart(dayRows);
  renderRankChart(extRows);
  renderTable(extRows);
}

const customPanel = document.getElementById('customRangePanel');
const customStartInput = document.getElementById('customStart');
const customEndInput = document.getElementById('customEnd');
const dataDates = allDates();
if (dataDates.length) {
  customStartInput.min = dataDates[0];
  customStartInput.max = dataDates[dataDates.length - 1];
  customEndInput.min = dataDates[0];
  customEndInput.max = dataDates[dataDates.length - 1];
  if (!customStartInput.value) customStartInput.value = dataDates[Math.max(0, dataDates.length - 7)];
  if (!customEndInput.value) customEndInput.value = dataDates[dataDates.length - 1];
}

document.getElementById('rangeGroup').addEventListener('click', (e) => {
  const btn = e.target.closest('.range-btn');
  if (!btn) return;
  const r = btn.dataset.range;
  if (r === 'custom') {
    document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    customPanel.hidden = false;
    return; // wait for "应用"
  }
  customPanel.hidden = true;
  customRange = null;
  document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentRange = r === 'all' ? 'all' : parseInt(r, 10);
  rerender();
});

document.getElementById('applyCustomRange').addEventListener('click', () => {
  const start = customStartInput.value, end = customEndInput.value;
  if (!start || !end || start > end) {
    showTooltip({clientX: 0, clientY: 0}, '请选择有效的起止日期');
    setTimeout(hideTooltip, 1500);
    return;
  }
  customRange = { start, end };
  rerender();
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  searchTerm = e.target.value.trim().toLowerCase();
  rerender();
});

document.querySelectorAll('#detailTable th').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.key;
    if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = -1; }
    document.querySelectorAll('#detailTable th').forEach(h => h.classList.remove('sorted'));
    th.classList.add('sorted');
    rerender();
  });
});

rerender();
</script>
</body>
</html>
